set_charge_schedule:
  name: Set charge schedule
  description: Update the vehicle's charge prohibition schedule. Pass an empty list to clear all rules.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to control.
      required: true
      selector:
        device:
          integration: myhondaplus
    rules:
      name: Schedule rules
      description: >
        List of up to 2 rules. Each rule must include days as a comma-separated list
        such as "mon,tue,wed", location as "home" or "all", and start/end times in
        24-hour HH:MM format.
      required: true
      example: '[{"days": "mon,tue,wed,thu,fri", "location": "home", "start_time": "22:00", "end_time": "06:00"}]'
      selector:
        object:

climate_on:
  name: Start climate with settings
  description: >
    Start climate control on the vehicle with the requested settings. Vehicles with numeric
    climate control use temperature and defrost, and ignore temp and duration.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to control.
      required: true
      selector:
        device:
          integration: myhondaplus
    temp:
      name: Temperature
      description: Climate temperature preset, for vehicles without numeric climate control.
      required: false
      default: "normal"
      example: "normal"
      selector:
        select:
          options:
            - "cooler"
            - "normal"
            - "hotter"
    temperature:
      name: Target temperature
      description: >
        Target temperature in degrees Celsius, for vehicles with numeric climate control.
        If you leave this empty, the vehicle uses the temperature set in Home Assistant, then
        the target it reports, then its default.
      required: false
      example: 21.5
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    duration:
      name: Duration
      description: Climate run time in minutes.
      required: false
      default: "30"
      example: "30"
      selector:
        select:
          options:
            - "10"
            - "20"
            - "30"
    defrost:
      name: Defrost
      description: Whether defrost should be enabled for this start command.
      required: false
      default: true
      example: true
      selector:
        boolean:

set_climate_schedule:
  name: Set climate schedule
  description: Update the vehicle's climate pre-conditioning schedule. Pass an empty list to clear all rules.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to control.
      required: true
      selector:
        device:
          integration: myhondaplus
    rules:
      name: Schedule rules
      description: >
        List of up to 7 rules. Each rule must include days as a comma-separated list
        such as "mon,tue,wed" and a start time in 24-hour HH:MM format.
      required: true
      example: '[{"days": "mon,tue,wed,thu,fri", "start_time": "07:00"}]'
      selector:
        object:

car_finder_location:
  name: Car Finder location
  description: >
    Request the vehicle's last GPS fix from Honda's Car Finder endpoint and
    return it as the service response. The reported position may differ
    from the vehicle's device_tracker (which is dashboard-derived); this is
    Honda's truthful TCU fix-time, not a server-stamped refresh time. Does
    not modify any sensors.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to query.
      required: true
      selector:
        device:
          integration: myhondaplus

set_geofence:
  name: Set geofence
  description: >
    Create or update the vehicle's geofence, centred on the car's current
    location. Choose a radius preset in kilometres or miles.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to control.
      required: true
      selector:
        device:
          integration: myhondaplus
    radius:
      name: Radius
      description: >
        Geofence radius. Presets are offered in both kilometres and miles;
        miles are converted to kilometres before sending.
      required: true
      default: "1 km"
      selector:
        select:
          mode: dropdown
          options:
            - "1 km"
            - "5 km"
            - "10 km"
            - "20 km"
            - "30 km"
            - "0.5 mi"
            - "1 mi"
            - "5 mi"
            - "10 mi"
            - "20 mi"

clear_geofence:
  name: Clear geofence
  description: Delete the vehicle's geofence zone.

  fields:
    device:
      name: Vehicle
      description: Select the My Honda+ vehicle to control.
      required: true
      selector:
        device:
          integration: myhondaplus
